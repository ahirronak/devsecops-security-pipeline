name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: SonarQube Cloud SAST and Quality Gate
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Trivy dependency, secret, and misconfiguration scan
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: .venv

      - name: Build Docker image
        id: docker_build
        run: docker build --tag devsecops-security-pipeline:${{ github.sha }} .

      - name: Trivy Docker image scan
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-security-pipeline:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Start application for DAST
        id: dast_app
        run: |
          docker network create security-network
          docker run --detach \
            --name webapp \
            --network security-network \
            devsecops-security-pipeline:${{ github.sha }}

          for attempt in {1..30}; do
            if docker exec webapp python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" > /dev/null 2>&1; then
              echo "Application is ready for DAST."
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready."
          docker logs webapp
          exit 1

      - name: OWASP ZAP baseline DAST scan
        id: zap
        continue-on-error: true
        run: |
          mkdir -p reports
          chmod 777 reports

          docker run --rm \
            --network security-network \
            --volume "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            --volume "${{ github.workspace }}/.zap/rules.tsv:/zap/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://webapp:5000 \
            -c /zap/rules.tsv \
            -I \
            -m 1 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md

      - name: Stop DAST application
        if: always()
        run: |
          docker rm --force webapp 2>/dev/null || true
          docker network rm security-network 2>/dev/null || true

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report-${{ github.run_number }}
          path: reports/zap-report.*
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce security gate
        if: always()
        env:
          SONAR_RESULT: ${{ steps.sonar.outcome }}
          TRIVY_FS_RESULT: ${{ steps.trivy_fs.outcome }}
          DOCKER_BUILD_RESULT: ${{ steps.docker_build.outcome }}
          TRIVY_IMAGE_RESULT: ${{ steps.trivy_image.outcome }}
          DAST_APP_RESULT: ${{ steps.dast_app.outcome }}
          ZAP_RESULT: ${{ steps.zap.outcome }}
        run: |
          echo "SonarQube result: $SONAR_RESULT"
          echo "Trivy source scan result: $TRIVY_FS_RESULT"
          echo "Docker build result: $DOCKER_BUILD_RESULT"
          echo "Trivy image scan result: $TRIVY_IMAGE_RESULT"
          echo "DAST application result: $DAST_APP_RESULT"
          echo "OWASP ZAP result: $ZAP_RESULT"

          if [ "$SONAR_RESULT" != "success" ] || \
             [ "$TRIVY_FS_RESULT" != "success" ] || \
             [ "$DOCKER_BUILD_RESULT" != "success" ] || \
             [ "$TRIVY_IMAGE_RESULT" != "success" ] || \
             [ "$DAST_APP_RESULT" != "success" ] || \
             [ "$ZAP_RESULT" != "success" ]; then
            echo "Security gate failed. Build and deployment are blocked."
            exit 1
          fi

          echo "Security gate passed."

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish approved image to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_IMAGE: devsecops-security-pipeline:${{ github.sha }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          APPROVED_IMAGE="$GHCR_IMAGE:${{ github.sha }}"

          docker tag "$SOURCE_IMAGE" "$APPROVED_IMAGE"
          docker push "$APPROVED_IMAGE"

          echo "Published approved image: $APPROVED_IMAGE"
          echo "### Approved container image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$APPROVED_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
