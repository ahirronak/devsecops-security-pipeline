name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: SonarQube Cloud SAST and Quality Gate
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Trivy dependency, secret, and misconfiguration scan
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: .venv

      - name: Build Docker image
        id: docker_build
        run: docker build --tag devsecops-security-pipeline:${{ github.sha }} .

      - name: Trivy Docker image scan
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-security-pipeline:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Enforce security gate
        if: always()
        env:
          SONAR_RESULT: ${{ steps.sonar.outcome }}
          TRIVY_FS_RESULT: ${{ steps.trivy_fs.outcome }}
          DOCKER_BUILD_RESULT: ${{ steps.docker_build.outcome }}
          TRIVY_IMAGE_RESULT: ${{ steps.trivy_image.outcome }}
        run: |
          echo "SonarQube result: $SONAR_RESULT"
          echo "Trivy source scan result: $TRIVY_FS_RESULT"
          echo "Docker build result: $DOCKER_BUILD_RESULT"
          echo "Trivy image scan result: $TRIVY_IMAGE_RESULT"

          if [ "$SONAR_RESULT" != "success" ] || \
             [ "$TRIVY_FS_RESULT" != "success" ] || \
             [ "$DOCKER_BUILD_RESULT" != "success" ] || \
             [ "$TRIVY_IMAGE_RESULT" != "success" ]; then
            echo "Security gate failed. Build and deployment are blocked."
            exit 1
          fi

          echo "Security gate passed."
